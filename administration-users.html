<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">

    <link rel="stylesheet" href="css/style.css">

    <style>

        .users-layout{
    display:grid;
    grid-template-columns:360px minmax(0,1fr);
    gap:20px;
    margin-top:25px;
    align-items:start;
}

        .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px;
    min-width:0;
}

        .panel h2{
            margin-bottom:20px;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
        }

        .form-group input,
        .form-group select{
            width:100%;
        }

        .checkbox-group{
            display:flex;
            align-items:center;
            gap:10px;
            margin-top:10px;
        }

        .checkbox-group input{
            width:auto;
        }

        .action-buttons{
            display:flex;
            gap:10px;
            margin-top:20px;
        }

        .search-box{
            margin-bottom:20px;
        }

        .users-table th,
        .users-table td{
            text-align:center;
        }

        @media(max-width:900px){

            .users-layout{
                grid-template-columns:1fr;
            }

        }

        

.users-table{
    width:auto !important;
    min-width:unset !important;
    table-layout:auto;
    border-collapse:collapse;
}

.users-table th,
.users-table td{
    padding:10px 8px;
    text-align:center;
    white-space:nowrap;
}

.users-table th:nth-child(1),
.users-table td:nth-child(1){
    width: 25%;
}

.users-table th:nth-child(2),
.users-table td:nth-child(2){
    width:25%;
}

.users-table th:nth-child(3),
.users-table td:nth-child(3){
    width:25%;
}


.action-cell{
    display:flex;
    justify-content:center;
    gap:6px;
}

.users-table td:last-child .btn{
    min-width:58px;
    padding:6px 10px;
    font-size:12px;
}

.container{
    width:95%;
    max-width:1250px;
}

.table-container{
    overflow-x:auto;
}

    </style>

</head>

<body>

<div id="navbar"></div>

<div class="container">

    <h1>User Management</h1>

    <div class="users-layout">

        <!-- LEFT PANEL -->

        <div class="panel">

            <h2>Create / Edit User</h2>

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username">

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password">

            </div>

            <div class="form-group">

                <label>Role</label>

                <select id="roleSelect">

                    <option value="">Select Role</option>

                </select>

            </div>

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="active"
                    checked>

                <label for="active">
                    Active User
                </label>

            </div>

            <div class="action-buttons">

                <button
                    class="btn btn-primary"
                    id="saveUserBtn">

                    Save User

                </button>

                <button
                    class="btn btn-secondary"
                    id="cancelBtn">

                    Cancel

                </button>

            </div>

        </div>


        <!-- RIGHT PANEL -->

        <div class="panel">

            <h2>Existing Users</h2>

            <input
                class="search-box"
                type="text"
                id="searchUser"
                placeholder="Search User...">

            <div class="table-container">

                <table class="users-table">

                    <thead>

                        <tr>

                            <th>Username</th>

                            <th>Role</th>

                            <th>Status</th>

                            <th>Actions</th>


                        </tr>

                    </thead>

                    <tbody id="usersTableBody">

                        <!-- Filled by JS -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/administration-users.js"></script>

</body>

</html>
