<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roles & Permissions</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">

    <link rel="stylesheet" href="css/style.css">

   <style>

.container{
    width:95%;
    max-width:1250px;
}

/* LAYOUT */

.roles-layout{
    display:grid;
    grid-template-columns:360px minmax(0,1fr);
    gap:20px;
    margin-top:25px;
    align-items:start;
}

/* PANEL */

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px;
    min-width:0;
}

.panel h2{
    margin-bottom:20px;
}

/* FORM */

.permission-group{
    border:1px solid var(--border);
    border-radius:6px;
    padding:15px;
    margin-bottom:18px;
}

.permission-group h3{
    margin-bottom:12px;
    color:var(--primary);
    font-size:16px;
}

.permission-item{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.search-box{
    margin-bottom:20px;
}

/* TABLE */

.table-container{
    display:flex;
    justify-content:center;
    overflow-x:auto;
}
.table-container{
    width:100%;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:4px;
}

.roles-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.roles-table th,
.roles-table td{
    padding:12px 16px;
    text-align:center;
}

.roles-table th:first-child,
.roles-table td:first-child{
    width:70%;
}

.roles-table th:last-child,
.roles-table td:last-child{
    width:30%;
}

.action-cell{
    display:flex;
    justify-content:center;
    gap:8px;
}

.action-cell .btn{
    min-width:60px;
    padding:6px 10px;
    font-size:12px;
}

/* RESPONSIVE */

@media(max-width:900px){

    .roles-layout{
        grid-template-columns:1fr;
    }

}


/* Override global table styles ONLY for Roles page */

.roles-table{
    width: 100% !important;
    min-width:0 !important;
}

.table-container .roles-table{
    min-width:0 !important;
}

.roles-table th,
.roles-table td{
    width:auto !important;
}

.table-container{
    overflow-x:hidden;
}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container">

    <h1>Roles & Permissions</h1>

    <div class="roles-layout">

        <!-- LEFT PANEL -->

        <div class="panel">

            <h2>Create / Edit Role</h2>

            <label>Role Name</label>

            <input
                type="text"
                id="roleName"
                placeholder="Enter Role Name">

            <br><br>

            <!-- Dashboard -->

            <div class="permission-group">

                <h3>Dashboard</h3>

                <div class="permission-item">
                    <input type="checkbox" id="analytics">
                    <label for="analytics">Analytics Dashboard</label>
                </div>

            </div>


            <!-- Invoice -->

            <div class="permission-group">

                <h3>Invoice</h3>

                <div class="permission-item">
                    <input type="checkbox" id="createInvoice">
                    <label>Create Invoice</label>
                </div>

                <div class="permission-item">
                    <input type="checkbox" id="viewInvoices">
                    <label>View Invoices</label>
                </div>

            </div>


            <!-- Purchase -->

            <div class="permission-group">

                <h3>Purchase</h3>

                <div class="permission-item">
                    <input type="checkbox" id="purchaseOrders">
                    <label>Purchase Orders</label>
                </div>

                <div class="permission-item">
                    <input type="checkbox" id="purchaseInvoices">
                    <label>Purchase Invoices</label>
                </div>

            </div>


            <!-- Payment -->

            <div class="permission-group">

                <h3>Payment Tracker</h3>

                <div class="permission-item">
                    <input type="checkbox" id="incomingPayments">
                    <label>Incoming Payments</label>
                </div>

                <div class="permission-item">
                    <input type="checkbox" id="outgoingPayments">
                    <label>Outgoing Payments</label>
                </div>

            </div>


            <!-- Production -->

            <div class="permission-group">

                <h3>Production</h3>

                <div class="permission-item">
                    <input type="checkbox" id="productionTracking">
                    <label>Production Tracking</label>
                </div>

                <div class="permission-item">
                    <input type="checkbox" id="viewProduction">
                    <label>View Production</label>
                </div>

            </div>


            <!-- ISO -->

            <div class="permission-group">

                <h3>ISO Informations</h3>

                <div class="permission-item">
                    <input type="checkbox" id="customers">
                    <label>Customers</label>
                </div>

                <div class="permission-item">
                    <input type="checkbox" id="products">
                    <label>Products</label>
                </div>

                <div class="permission-item">
                    <input type="checkbox" id="employees">
                    <label>Employee Details</label>
                </div>

                <div class="permission-item">
                    <input type="checkbox" id="routeCards">
                    <label>Route Cards</label>
                </div>

            </div>


            <!-- Administration -->

            <div class="permission-group">

                <h3>Administration</h3>

                <div class="permission-item">
                    <input type="checkbox" id="userManagement">
                    <label>User Management</label>
                </div>

                <div class="permission-item">
                    <input type="checkbox" id="roleManagement">
                    <label>Roles & Permissions</label>
                </div>

            </div>

            <div class="action-buttons">

                <button class="btn btn-primary" id="saveRoleBtn">
                    Save Role
                </button>

                <button class="btn btn-secondary" id="cancelBtn">
                    Cancel
                </button>

            </div>

        </div>


        <!-- RIGHT PANEL -->

        <div class="panel">

            <h2>Existing Roles</h2>

            <input
                class="search-box"
                type="text"
                id="searchRole"
                placeholder="Search Role...">

            <div class="table-container">

                <table class="roles-table">

                    <thead>

                        <tr>

                            <th>Role Name</th>

                            <th>Actions</th>


                        </tr>

                    </thead>

                    <tbody id="rolesTableBody">

                        <!-- Loaded by JS -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/administration-roles.js"></script>

</body>

</html>
